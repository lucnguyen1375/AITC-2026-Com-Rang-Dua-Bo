services:
  - type: web
    name: bua-viet
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_REASONING_EFFORT
        value: none
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
